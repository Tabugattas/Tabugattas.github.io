<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500&family=Gilda+Display&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#eef2f6}
.bg{position:absolute;inset:-20px;background:url(../images/hero-background.jpg) center/cover;filter:blur(8px)}
.photo{position:absolute;left:150px;top:0;width:420px;height:630px;object-fit:cover;object-position:50% 40%}
.text{position:absolute;left:570px;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#204a86;text-align:center}
.head{display:flex;flex-direction:column;align-items:stretch;width:max-content}
.dash{height:3px;border-radius:2px;background:linear-gradient(90deg,#d9b56a,#f3dc9c 50%,#c99a4c);margin:22px 0}
h1{font:400 84px/1.1 "Gilda Display",serif;letter-spacing:.01em}
.date{font:500 58px/1 "Cormorant SC",serif;margin-top:30px;letter-spacing:.02em}
.names{font:400 78px/1.1 "Pinyon Script",cursive;margin-top:26px}
</style></head><body>
<div class="bg"></div>
<img class="photo" src="../images/hero-photo.jpg" alt="">
<div class="text"><div class="head"><span class="dash"></span><h1>SAVE THE<br>DATE</h1><span class="dash"></span></div>
<p class="date">July 22, 2027</p><p class="names">Tarek &amp; Elen</p></div>
</body></html>
